name: Daily data update

# Once a day, after Raider.IO refreshes its numbers (around 07:00 UTC):
# download new cutoffs, commit them, tag a release and publish it.
# Tags pushed by this workflow can't trigger release.yml, so packaging happens here.
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
      WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download Raider.IO and Warcraft Logs data
        run: python tools/update_data.py --full --regions us,eu,kr,tw --wcl-budget 3200

      - name: Commit and tag if the data changed
        id: tag
        run: |
          git add Data.lua
          if [ -d tools/cache ]; then git add tools/cache; fi
          if git diff --cached --quiet; then
            echo "No data change, skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed -E 's/^v//; s/-data\..*//')
          tag="v${base:-2.0.0}-data.$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git tag "$tag"
          git push origin HEAD "$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Package and publish
        if: steps.tag.outputs.release == 'true'
        uses: BigWigsMods/packager@v2
